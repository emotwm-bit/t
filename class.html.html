<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>倚盟電訊 班表查詢</title>
<style>
  :root {
    --header-green: #2e7d4f;
    --header-green-dark: #1b5e3a;
    --mint-bg: #f4f1e8;
    --header-banner: #fdf3c7;
    --accent-coral: #ffcf7a;
    --accent-coral-dark: #6b4a00;
    --border-c: #c9c2a0;
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
    background: var(--mint-bg);
    margin: 0;
    padding: 16px;
    color: #223229;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 {
    text-align: center;
    font-size: 20px;
    color: var(--header-green-dark);
    margin: 4px 0 16px;
  }
  .controls {
    display: flex;
    gap: 8px;
    align-items: center;
    justify-content: center;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .controls button {
    background: var(--header-green);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 15px;
    cursor: pointer;
  }
  .controls button:active { opacity: 0.8; }
  .controls select {
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--border-c);
    font-size: 15px;
    background: white;
    min-width: 150px;
    flex-shrink: 0;
    box-sizing: border-box;
  }
  /* 日期欄：自己畫文字，原生日期選擇器透明疊在上面，
     這樣各家手機／瀏覽器看到的都是同一段完整日期，不會被截掉 */
  .date-field {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 8px 12px;
    border: 1px solid var(--border-c);
    border-radius: 8px;
    background: white;
    font-size: 15px;
    font-variant-numeric: tabular-nums;
    color: #223229;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
    touch-action: manipulation;
    -webkit-tap-highlight-color: rgba(46,125,79,.15);
  }
  .date-field > span { pointer-events: none; }
  .date-field::after { content: "📅"; font-size: 14px; line-height: 1; pointer-events: none; }
  .date-field input[type=date] {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    margin: 0;
    padding: 0;
    border: 0;
    background: transparent;
    cursor: pointer;
    font-size: 16px;            /* 低於 16px 時 iOS 會自動放大畫面 */
    -webkit-appearance: none;
    appearance: none;
    touch-action: manipulation;
  }
  @media (max-width: 420px) {
    .date-field { flex: 1 1 100%; order: -1; width: 100%; }
  }
  .date-banner {
    background: var(--header-banner);
    text-align: center;
    font-size: 22px;
    font-weight: bold;
    padding: 12px;
    border-radius: 10px 10px 0 0;
    color: #d32f2f;
    letter-spacing: 1px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    border-radius: 0 0 10px 10px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(47,107,79,0.12);
  }
  th {
    background: var(--header-green);
    color: white;
    padding: 10px 4px;
    font-size: 15px;
    border: 1px solid var(--header-green-dark);
  }
  td {
    text-align: center;
    padding: 10px 4px;
    border: 1px solid var(--border-c);
    font-size: 15px;
    vertical-align: top;
    background: #fbfdfc;
  }
  .empty-day { text-align: center; color: #8a9a91; padding: 30px 0; font-size: 15px; }
  td.mgr-cell {
    background: #ffe6a3;
    font-weight: bold;
    color: #6b4a00;
  }
  tr.coef-row td {
    background: #d7ecc4;
    color: #2e5c1f;
    font-weight: bold;
    font-size: 14px;
  }
  .quote {
    display: block;
    padding: 15px 14px 14px;
    margin: 0;
    text-align: left;
    line-height: 1.75;
  }
  .quote .q-ico { display: inline-block; font-size: 16px; line-height: 1;
    margin-right: 6px; vertical-align: -1px;
    -webkit-text-fill-color: initial;   /* 不被文字漸層吃掉顏色 */
    animation: qbob 3.6s ease-in-out infinite; }
  .quote .q-txt { display: block; }
  .quote .q-lbl {
    display: block; font-size: 11.5px; letter-spacing: .14em; font-weight: bold;
    color: #4e7a5e; margin-bottom: 3px; white-space: nowrap;
  }
  .quote .q-line {
    display: block;
    font-size: 15.5px; font-weight: bold; line-height: 1.65; color: #223229;
    background: linear-gradient(100deg,#223229 34%,#7fb894 50%,#223229 66%);
    background-size: 260% 100%;
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shine 7s ease-in-out infinite;
    transition: opacity .45s ease;
  }
  .quote .q-line.fade { opacity: 0; }
  @keyframes shine { 0%,62% { background-position: 160% 0 } 100% { background-position: -60% 0 } }
  @keyframes qbob { 0%,100% { transform: translateY(0) rotate(0) }
                    50% { transform: translateY(-3px) rotate(-6deg) } }
  @media (prefers-reduced-motion: reduce) {
    .quote .q-ico { animation: none }
    .quote .q-line { animation: none; background: none;
      -webkit-text-fill-color: #223229 }
  }
  /* 12星座運勢 */
  .horo { background:#fff; border:1px solid var(--border-c); border-radius:12px;
    margin-top:12px; box-shadow:0 2px 8px rgba(47,107,79,.12); overflow:hidden; }
  .horo-head { padding:14px 16px 12px; text-align:center;
    background:linear-gradient(180deg,#FFF6E9,#fffdf8); border-bottom:1px solid #F0E6D2; }
  .horo-head .h-date { display:inline-block; font-size:12.5px; font-weight:bold; color:#B5733A;
    background:#FFF0DC; border:1px solid #F2D9B4; border-radius:99px; padding:3px 12px; }
  .horo-head h3 { margin:7px 0 0; font-size:21px; font-weight:900; letter-spacing:.02em;
    color:#4A3524; }
  .horo-head .h-sub { font-size:13px; color:#9A7A58; margin-top:5px; line-height:1.6; }
  .zgrid { display:grid; grid-template-columns:repeat(3,1fr); gap:9px; padding:13px; }
  @media (max-width:560px){
    .zgrid{ grid-template-columns:repeat(2,1fr); gap:8px; padding:10px }
    .z-top{ flex-wrap:wrap; }
    .z-star{ margin-left:0; width:100%; margin-top:3px; }  /* 星等換到下一行，名字就不會被拆開 */
    .z-nm{ font-size:13.5px; }
  }
  .z { background:#FFFDF9; border:1px solid #EFE7D8; border-radius:10px; padding:10px 10px 11px;
    animation:zIn .42s ease both; }
  .z:hover { background:#FFFBF2; }
  @keyframes zIn { from{opacity:0;transform:translateY(7px)} to{opacity:1;transform:none} }
  .z-top { display:flex; align-items:center; gap:5px; }
  .z-no { font-size:11px; font-weight:bold; color:#fff; background:#C9BBA6;
    width:17px; height:17px; border-radius:99px; display:grid; place-items:center; flex:none; }
  .z.top1 .z-no{background:#E0A32B} .z.top2 .z-no{background:#A9B2BC} .z.top3 .z-no{background:#C58D5E}
  .z-sym { font-size:16px; line-height:1; flex:none; }
  .z-nm { font-size:14px; font-weight:bold; color:#2B2318; white-space:nowrap; }
  .z-star { margin-left:auto; font-size:10px; letter-spacing:.5px; color:#E8A33D; flex:none; }
  .z-star span { color:#E6DECF; }
  .z-txt { font-size:12.5px; line-height:1.7; color:#5C5244; margin-top:6px; }
  .z-luck { font-size:11px; color:#9A8F7C; margin-top:6px; display:flex; gap:6px; flex-wrap:wrap; }
  .z-luck b { font-weight:bold; border-radius:99px; padding:1px 7px; }
  .horo-foot { padding:0 14px 13px; font-size:11.5px; color:#9aa79d; text-align:center; }
  @media (prefers-reduced-motion:reduce){ .z{animation:none} }
  .footer-note {
    text-align: center;
    font-size: 12px;
    color: #7c9187;
    margin-top: 14px;
  }
  .edit-panel {
    background: white;
    border-radius: 10px;
    padding: 14px;
    margin-top: 14px;
    box-shadow: 0 2px 8px rgba(47,107,79,0.12);
    display: none;
  }
  .edit-panel.open { display: block; }
  .edit-panel h3 { margin-top: 0; font-size: 16px; color: var(--header-green); }
  .edit-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 10px;
  }
  .edit-store label {
    font-weight: bold;
    display: block;
    margin-bottom: 4px;
    color: var(--header-green-dark);
    font-size: 14px;
  }
  .edit-store textarea {
    width: 100%;
    min-height: 90px;
    border: 1px solid var(--border-c);
    border-radius: 6px;
    padding: 6px;
    font-size: 14px;
    font-family: inherit;
    resize: vertical;
  }
  .save-row {
    margin-top: 12px;
    display: flex;
    gap: 8px;
    justify-content: flex-end;
  }
  .save-row button {
    border: none;
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 14px;
    cursor: pointer;
  }
  .btn-save { background: var(--header-green); color: white; }
  .btn-cancel { background: #e2ede7; color: #3a4a42; }
  .status-msg {
    text-align: center;
    font-size: 13px;
    margin-top: 8px;
    min-height: 18px;
    color: var(--header-green);
  }
  .lock-msg {
    text-align: center;
    font-size: 13px;
    color: var(--accent-coral-dark);
    margin-top: 6px;
  }
  .date-hint {
    text-align: center;
    font-size: 12px;
    color: #6a8a76;
    margin: -6px 0 12px;
  }
</style>
</head>

</div>

let scheduleData = DEFAULT_SCHEDULE;

function pad2(n) { return String(n).padStart(2,"0"); }
function isoOf(y,m,d) { return `${y}-${pad2(m)}-${pad2(d)}`; }

function formatDateBanner(y, m, d) {
  const dt = new Date(y, m - 1, d);
  const wd = WEEKDAY_ZH[dt.getDay()];
  return `${y}/${m}/${d} 星期${wd}`;
}

function getDayData(iso) {
  const rec = scheduleData[iso];
  if (!rec) return null;
  return rec;
}

function renderDay() {
  const picker = document.getElementById("datePicker");
  const [y, m, d] = picker.value.split("-").map(Number);
  document.getElementById("dateBanner").textContent = formatDateBanner(y, m, d);
  document.getElementById("dateLabel").textContent = `${y}/${pad2(m)}/${pad2(d)}`;

  const headerRow = document.getElementById("headerRow");
  const tbody = document.getElementById("scheduleBody");
  headerRow.innerHTML = "";
  tbody.innerHTML = "";

  const dayData = getDayData(isoOf(y, m, d));

  if (!dayData) {
    tbody.innerHTML = `<tr><td colspan="6" class="empty-day">尚無此日期資料</td></tr>`;
    STORES.forEach(s => {
      const th = document.createElement("th");
      th.textContent = s;
      headerRow.appendChild(th);
    });
    return;
  }

  const displayCols = STORES.filter(s =>
    s !== "總部" || (dayData.stores["總部"] || []).length > 0);
  displayCols.forEach(s => {
    const th = document.createElement("th");
    th.textContent = s;
    headerRow.appendChild(th);
  });

  /* 依職級排序，同職級維持原本順序 */
  const ordered = {};
  displayCols.forEach(s => {
    ordered[s] = (dayData.stores[s] || [])
      .map((n, i) => ({ n, i, r: rankOf(n, s) }))
      .sort((a, b) => a.r - b.r || a.i - b.i)
      .map(x => x.n);
  });

  const maxLen = Math.max(...displayCols.map(s => ordered[s].length), 1);
  for (let i = 0; i < maxLen; i++) {
    const tr = document.createElement("tr");
    displayCols.forEach(s => {
      const td = document.createElement("td");
      const names = ordered[s];
      const name = names[i] || "";
      td.textContent = name;
      if (name && NAME_BG[name]) {
        td.style.background = NAME_BG[name];
      } else if (name && MANAGER_SET.has(name)) {
        td.classList.add("mgr-cell");
      }
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  }

  const coefRow = document.createElement("tr");
  coefRow.className = "coef-row";
  displayCols.forEach(s => {
    const td = document.createElement("td");
    if (s === "總部") {
      td.textContent = "";
    } else {
      const val = (dayData.coef && dayData.coef[s] !== undefined) ? dayData.coef[s] : 0;
      td.textContent = val.toFixed(2);
    }
    coefRow.appendChild(td);
  });
  tbody.appendChild(coefRow);
}

/* 支援 showPicker 的瀏覽器（電腦版 Chrome/Edge 等）：點整個欄位就打開日曆。
   不支援的舊版：透明的原生欄位仍可直接點，行為不變。 */
(function bindPicker() {
  const dp = document.getElementById("datePicker");
  const field = document.getElementById("dateField");
  /* 觸控裝置：讓透明的原生欄位自己接手，手指點下去就會叫出系統日曆。
     滑鼠裝置：原生欄位不吃點擊，改由整個欄位觸發 showPicker。 */
  const coarse = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
  if (!coarse && typeof dp.showPicker === "function") {
    dp.style.pointerEvents = "none";
  }
  field.addEventListener("click", (e) => {
    if (e.target === dp) return;          /* 點在原生欄位上，交給系統處理 */
    if (typeof dp.showPicker === "function") {
      try { dp.showPicker(); return; } catch (err) {}
    }
    dp.focus();
    dp.click();
  });
})();

function hseed(str){ let h=2166136261; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619);} return (h>>>0); }
/* 以日期為種子洗牌，確保同一天 12 個星座拿到 12 句不同的話 */
function dayTexts(iso){
  const idx = Z_TXT.map((_, i) => i);
  let r = hseed("txt|" + iso);
  for (let i = idx.length - 1; i > 0; i--) {
    r = (Math.imul(r, 1664525) + 1013904223) >>> 0;
    const j = r % (i + 1);
    [idx[i], idx[j]] = [idx[j], idx[i]];
  }
  return idx.slice(0, SIGNS.length).map(i => Z_TXT[i]);
}
function zOf(iso, sign){
  const h = hseed(iso + "|" + sign);
  return { h, star: 2 + (h % 4),
    col: Z_COLOR[(h>>>9) % Z_COLOR.length],
    num: 1 + ((h>>>17) % 9) };
}
function drawZodiac(){
  const iso = document.getElementById("datePicker").value;
  if (!iso) return;
  const [y,m,dd] = iso.split("-").map(Number);
  const wd = W_ZH[new Date(y, m-1, dd).getDay()];
  document.getElementById("zDate").textContent = m + "/" + dd + "　星期" + wd;
  const hs = hseed(iso);
  document.getElementById("zSub").textContent = Z_SUB[hs % Z_SUB.length];

  const texts = dayTexts(iso);
  const data = SIGNS.map((sg, i) => {
    const r = zOf(iso, sg[0]);
    r.txt = texts[i];
    return { i, name: sg[0], sym: sg[1], c: sg[2], r, score: r.star * 1000 + (r.h % 1000) };
  });
  const order = data.slice().sort((a,b) => b.score - a.score).map(x => x.name);

  document.getElementById("zGrid").innerHTML = data.map((x, idx) => {
    const rank = order.indexOf(x.name);
    const cls = rank < 3 ? " top" + (rank+1) : "";
    return '<div class="z' + cls + '" style="animation-delay:' + (idx*0.03).toFixed(2) + 's">' +
      '<div class="z-top">' +
        '<span class="z-no">' + (idx+1) + '</span>' +
        '<span class="z-sym" style="color:' + x.c + '">' + x.sym + '</span>' +
        '<span class="z-nm">' + x.name + '</span>' +
        '<span class="z-star">' + "★".repeat(x.r.star) +
          '<span>' + "★".repeat(5 - x.r.star) + '</span></span>' +
      '</div>' +
      '<div class="z-txt">' + x.r.txt[0] + '，<br>' + x.r.txt[1] + '。</div>' +
      '<div class="z-luck">' +
        '<b style="background:' + x.r.col[1] + ';color:' + x.r.col[2] + '">' + x.r.col[0] + '</b>' +
        '<b style="background:#F2EFE6;color:#6b5a3a">幸運 ' + x.r.num + '</b>' +
      '</div></div>';
  }).join('');
}
