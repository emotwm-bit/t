<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>倚盟電訊 班表查詢</title>
<style>
  :root {
    --header-green: #2e7d4f;
    --header-green-dark: #1b5e3a;
    --mint-bg: #f4f1e8;
    --header-banner: #fdf3c7;
    --accent-coral: #ffcf7a;
    --accent-coral-dark: #6b4a00;
    --border-c: #c9c2a0;
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
    background: var(--mint-bg);
    margin: 0;
    padding: 16px;
    color: #223229;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 {
    text-align: center;
    font-size: 20px;
    color: var(--header-green-dark);
    margin: 4px 0 16px;
  }
  .controls {
    display: flex;
    gap: 8px;
    align-items: center;
    justify-content: center;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .controls button {
    background: var(--header-green);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 15px;
    cursor: pointer;
  }
  .controls button:active { opacity: 0.8; }
  .controls select {
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--border-c);
    font-size: 15px;
    background: white;
    min-width: 150px;
    flex-shrink: 0;
    box-sizing: border-box;
  }
  /* 日期欄：自己畫文字，原生日期選擇器透明疊在上面，
     這樣各家手機／瀏覽器看到的都是同一段完整日期，不會被截掉 */
  .date-field {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 8px 12px;
    border: 1px solid var(--border-c);
    border-radius: 8px;
    background: white;
    font-size: 15px;
    font-variant-numeric: tabular-nums;
    color: #223229;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
    touch-action: manipulation;
    -webkit-tap-highlight-color: rgba(46,125,79,.15);
  }
  .date-field > span { pointer-events: none; }
  .date-field::after { content: "📅"; font-size: 14px; line-height: 1; pointer-events: none; }
  .date-field input[type=date] {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    margin: 0;
    padding: 0;
    border: 0;
    background: transparent;
    cursor: pointer;
    font-size: 16px;            /* 低於 16px 時 iOS 會自動放大畫面 */
    -webkit-appearance: none;
    appearance: none;
    touch-action: manipulation;
  }
  @media (max-width: 420px) {
    .date-field { flex: 1 1 100%; order: -1; width: 100%; }
  }
  .date-banner {
    background: var(--header-banner);
    text-align: center;
    font-size: 22px;
    font-weight: bold;
    padding: 12px;
    border-radius: 10px 10px 0 0;
    color: #d32f2f;
    letter-spacing: 1px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    border-radius: 0 0 10px 10px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(47,107,79,0.12);
  }
  th {
    background: var(--header-green);
    color: white;
    padding: 10px 4px;
    font-size: 15px;
    border: 1px solid var(--header-green-dark);
  }
  td {
    text-align: center;
    padding: 10px 4px;
    border: 1px solid var(--border-c);
    font-size: 15px;
    vertical-align: top;
    background: #fbfdfc;
  }
  .empty-day { text-align: center; color: #8a9a91; padding: 30px 0; font-size: 15px; }
  td.mgr-cell {
    background: #ffe6a3;
    font-weight: bold;
    color: #6b4a00;
  }
  tr.coef-row td {
    background: #d7ecc4;
    color: #2e5c1f;
    font-weight: bold;
    font-size: 14px;
  }
  .quote {
    display: block;
    padding: 15px 14px 14px;
    margin: 0;
    text-align: left;
    line-height: 1.75;
  }
  .quote .q-ico { display: inline-block; font-size: 16px; line-height: 1;
    margin-right: 6px; vertical-align: -1px;
    -webkit-text-fill-color: initial;   /* 不被文字漸層吃掉顏色 */
    animation: qbob 3.6s ease-in-out infinite; }
  .quote .q-txt { display: block; }
  .quote .q-lbl {
    display: block; font-size: 11.5px; letter-spacing: .14em; font-weight: bold;
    color: #4e7a5e; margin-bottom: 3px; white-space: nowrap;
  }
  .quote .q-line {
    display: block;
    font-size: 15.5px; font-weight: bold; line-height: 1.65; color: #223229;
    background: linear-gradient(100deg,#223229 34%,#7fb894 50%,#223229 66%);
    background-size: 260% 100%;
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shine 7s ease-in-out infinite;
    transition: opacity .45s ease;
  }
  .quote .q-line.fade { opacity: 0; }
  @keyframes shine { 0%,62% { background-position: 160% 0 } 100% { background-position: -60% 0 } }
  @keyframes qbob { 0%,100% { transform: translateY(0) rotate(0) }
                    50% { transform: translateY(-3px) rotate(-6deg) } }
  @media (prefers-reduced-motion: reduce) {
    .quote .q-ico { animation: none }
    .quote .q-line { animation: none; background: none;
      -webkit-text-fill-color: #223229 }
  }
  /* 12星座運勢 */
  .horo { background:#fff; border:1px solid var(--border-c); border-radius:12px;
    margin-top:12px; box-shadow:0 2px 8px rgba(47,107,79,.12); overflow:hidden; }
  .horo-head { padding:14px 16px 12px; text-align:center;
    background:linear-gradient(180deg,#FFF6E9,#fffdf8); border-bottom:1px solid #F0E6D2; }
  .horo-head .h-date { display:inline-block; font-size:12.5px; font-weight:bold; color:#B5733A;
    background:#FFF0DC; border:1px solid #F2D9B4; border-radius:99px; padding:3px 12px; }
  .horo-head h3 { margin:7px 0 0; font-size:21px; font-weight:900; letter-spacing:.02em;
    color:#4A3524; }
  .horo-head .h-sub { font-size:13px; color:#9A7A58; margin-top:5px; line-height:1.6; }
  .zgrid { display:grid; grid-template-columns:repeat(3,1fr); gap:9px; padding:13px; }
  @media (max-width:560px){
    .zgrid{ grid-template-columns:repeat(2,1fr); gap:8px; padding:10px }
    .z-top{ flex-wrap:wrap; }
    .z-star{ margin-left:0; width:100%; margin-top:3px; }  /* 星等換到下一行，名字就不會被拆開 */
    .z-nm{ font-size:13.5px; }
  }
  .z { background:#FFFDF9; border:1px solid #EFE7D8; border-radius:10px; padding:10px 10px 11px;
    animation:zIn .42s ease both; }
  .z:hover { background:#FFFBF2; }
  @keyframes zIn { from{opacity:0;transform:translateY(7px)} to{opacity:1;transform:none} }
  .z-top { display:flex; align-items:center; gap:5px; }
  .z-no { font-size:11px; font-weight:bold; color:#fff; background:#C9BBA6;
    width:17px; height:17px; border-radius:99px; display:grid; place-items:center; flex:none; }
  .z.top1 .z-no{background:#E0A32B} .z.top2 .z-no{background:#A9B2BC} .z.top3 .z-no{background:#C58D5E}
  .z-sym { font-size:16px; line-height:1; flex:none; }
  .z-nm { font-size:14px; font-weight:bold; color:#2B2318; white-space:nowrap; }
  .z-star { margin-left:auto; font-size:10px; letter-spacing:.5px; color:#E8A33D; flex:none; }
  .z-star span { color:#E6DECF; }
  .z-txt { font-size:12.5px; line-height:1.7; color:#5C5244; margin-top:6px; }
  .z-luck { font-size:11px; color:#9A8F7C; margin-top:6px; display:flex; gap:6px; flex-wrap:wrap; }
  .z-luck b { font-weight:bold; border-radius:99px; padding:1px 7px; }
  .horo-foot { padding:2px 14px 15px; font-size:13.5px; font-weight:bold;
    color:#7A6A4E; text-align:center; letter-spacing:.02em; }
  /* 收合按鈕 */
  .zbtn-wrap { text-align:center; margin-top:16px; }
  #zBtn {
    font: inherit; font-size:15px; font-weight:bold; cursor:pointer;
    color:#6B4A8A; background:#F3EDF9; border:1px solid #DDD0EC;
    border-radius:99px; padding:10px 22px; transition:.15s;
  }
  #zBtn:hover { background:#EBE2F5; }
  #zBtn:focus-visible { outline:2px solid #9B7DBF; outline-offset:2px; }
  #zBtn .arr { display:inline-block; margin-left:6px; transition:transform .25s; }
  #zBtn.open .arr { transform:rotate(180deg); }
  .horo { display:none; }
  .horo.open { display:block; animation:horoIn .35s ease both; }
  @keyframes horoIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
  @media (prefers-reduced-motion:reduce){ .horo.open{animation:none} }
  @media (prefers-reduced-motion:reduce){ .z{animation:none} }
  .footer-note {
    text-align: center;
    font-size: 12px;
    color: #7c9187;
    margin-top: 14px;
  }
  .edit-panel {
    background: white;
    border-radius: 10px;
    padding: 14px;
    margin-top: 14px;
    box-shadow: 0 2px 8px rgba(47,107,79,0.12);
    display: none;
  }
  .edit-panel.open { display: block; }
  .edit-panel h3 { margin-top: 0; font-size: 16px; color: var(--header-green); }
  .edit-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 10px;
  }
  .edit-store label {
    font-weight: bold;
    display: block;
    margin-bottom: 4px;
    color: var(--header-green-dark);
    font-size: 14px;
  }
  .edit-store textarea {
    width: 100%;
    min-height: 90px;
    border: 1px solid var(--border-c);
    border-radius: 6px;
    padding: 6px;
    font-size: 14px;
    font-family: inherit;
    resize: vertical;
  }
  .save-row {
    margin-top: 12px;
    display: flex;
    gap: 8px;
    justify-content: flex-end;
  }
  .save-row button {
    border: none;
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 14px;
    cursor: pointer;
  }
  .btn-save { background: var(--header-green); color: white; }
  .btn-cancel { background: #e2ede7; color: #3a4a42; }
  .status-msg {
    text-align: center;
    font-size: 13px;
    margin-top: 8px;
    min-height: 18px;
    color: var(--header-green);
  }
  .lock-msg {
    text-align: center;
    font-size: 13px;
    color: var(--accent-coral-dark);
    margin-top: 6px;
  }
  .date-hint {
    text-align: center;
    font-size: 12px;
    color: #6a8a76;
    margin: -6px 0 12px;
  }
  .controls button:disabled { opacity: .4; cursor: default; }

  /* 我的班 */
  .me-bar {
    background: #fff; border: 1px solid var(--border-c); border-radius: 10px;
    padding: 10px 12px; margin-bottom: 12px; text-align: center;
  }
  .me-bar label { font-size: 15px; font-weight: bold; color: var(--header-green-dark); }
  .me-bar select {
    margin-left: 6px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--border-c);
    font-size: 16px; background: #fff; font-family: inherit;
  }
  .me-info { font-size: 14px; color: #3a4a42; margin-top: 8px; line-height: 1.7; }
  .me-info:empty { display: none; }
  .me-info b { color: #c2551d; }
  .me-info .me-part { white-space: nowrap; }
  .me-info .me-off { color: #d32f2f; font-weight: bold; }
  td.me { box-shadow: inset 0 0 0 3px #e0662b; font-weight: bold; }

  /* 支援標籤 */
  .sup-tag {
    display: block; width: fit-content; margin: 3px auto 0;
    font-size: 10.5px; font-weight: bold; line-height: 1.5;
    color: #fff; background: #5b8fc9; border-radius: 99px; padding: 0 6px;
  }

  /* 人力係數列 */
  tr.coef-label td {
    background: #eef5e6; color: #4e7a3e; font-size: 12px; font-weight: bold;
    padding: 3px 4px; letter-spacing: .1em;
  }
  tr.coef-row td.coef-low { background: #f8d4d0; color: #a3271d; }

  /* 圖例 */
  .legend {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 14px;
    font-size: 12.5px; color: #5c6b62; margin-top: 10px;
  }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend i {
    display: inline-block; width: 14px; height: 14px; border-radius: 3px;
    border: 1px solid var(--border-c);
  }
  .legend .sup-tag { display: inline-block; margin: 0; }
  /* 每日／整月切換 */
  .view-tabs { display: flex; justify-content: center; gap: 0; margin: -4px auto 14px;
    background: #e4dfcc; border-radius: 99px; padding: 3px; width: fit-content; }
  .view-tabs button { font: inherit; font-size: 15px; font-weight: bold; border: 0; cursor: pointer;
    background: transparent; color: #5c6b62; padding: 7px 18px; border-radius: 99px; }
  .view-tabs button.on { background: var(--header-green); color: #fff; }
  [hidden] { display: none !important; }

  /* 整月總覽 */
  .mv-head { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 10px; }
  .mv-head button { background: var(--header-green); color: #fff; border: 0; border-radius: 8px;
    padding: 6px 14px; font-size: 15px; cursor: pointer; }
  .mv-head button:disabled { opacity: .35; cursor: default; }
  #mLabel { font-size: 20px; font-weight: bold; color: #d32f2f; min-width: 120px; text-align: center; }
  .mv-sub { display: flex; justify-content: center; gap: 8px; margin-bottom: 10px; }
  .mv-sub button { font: inherit; font-size: 14px; font-weight: bold; cursor: pointer;
    border: 1px solid var(--border-c); background: #fff; color: #5c6b62; border-radius: 8px; padding: 6px 14px; }
  .mv-sub button.on { background: #fdf3c7; color: #6b4a00; border-color: #e3c873; }
  .mv-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 10px;
    box-shadow: 0 2px 8px rgba(47,107,79,0.12); background: #fff; }
  .mv-scroll table { box-shadow: none; border-radius: 0; overflow: visible; }
  .mv-note { text-align: center; font-size: 12.5px; color: #6a8a76; margin-top: 8px; line-height: 1.7; }

  /* 各店人力表 */
  table.mstaff td { padding: 6px 2px; vertical-align: middle; cursor: pointer; }
  table.mstaff td.d { font-weight: bold; white-space: nowrap; color: #3a4a42; }
  table.mstaff td .c { display: block; font-weight: bold; font-size: 14.5px; color: #2e5c1f; }
  table.mstaff td .n { display: block; font-size: 11px; color: #8a9a91; }
  table.mstaff td.low { background: #f8d4d0; }
  table.mstaff td.low .c { color: #a3271d; }
  table.mstaff tr.we td.d { color: #d32f2f; }
  table.mstaff tr.today td { box-shadow: inset 0 2px 0 #e0662b, inset 0 -2px 0 #e0662b; }
  table.mstaff tr:hover td { filter: brightness(.97); }
  table.mstaff tr.avg td { background: #eef5e6; cursor: default; font-weight: bold; color: #4e7a3e; }

  /* 全員班表：只凸顯「休」和「支援」，原店上班只上淡綠底不寫字 */
  table.mpeople { width: auto; min-width: 100%; border-collapse: separate; border-spacing: 0; }
  table.mpeople th, table.mpeople td { padding: 6px 0; min-width: 28px; font-size: 13px;
    border: 0; border-right: 1px solid #ece7d6; border-bottom: 1px solid #ece7d6; }
  table.mpeople th { font-size: 12px; line-height: 1.25; cursor: pointer; border-color: var(--header-green-dark); }
  table.mpeople th.we { background: #3f8f60; }
  table.mpeople th.today { box-shadow: inset 0 -3px 0 #ffcf7a; }
  table.mpeople .nm { position: sticky; left: 0; z-index: 1; min-width: 64px; padding: 6px 8px;
    text-align: left; white-space: nowrap; font-weight: bold; background: #fff;
    border-right: 1px solid var(--border-c); }
  table.mpeople th.nm { background: var(--header-green); z-index: 2; cursor: default; }
  table.mpeople tr.grp td { background: #f4f1e8; color: #2e5c1f; font-weight: bold; text-align: left;
    padding: 5px 8px; font-size: 12.5px; border-right: 0; }
  table.mpeople td.w { background: #e3f1e6; }
  table.mpeople td.w.we { background: #d5eadb; }
  table.mpeople td.off { background: #fff; color: #d0533f; font-weight: bold; }
  table.mpeople td.sup { background: #5b8fc9; color: #fff; font-weight: bold; }
  table.mpeople td.boss { background: #fff6dc; color: #6b4a00; }
  table.mpeople td.cnt { font-weight: bold; color: #6b4a00; background: #fdf3c7; min-width: 36px; }
  table.mpeople tr.me td { box-shadow: inset 0 2px 0 #e0662b, inset 0 -2px 0 #e0662b; }
  table.mpeople tr.me td.nm { color: #c2551d; }
  .mv-key { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 14px; margin-top: 8px;
    font-size: 12.5px; color: #5c6b62; }
  .mv-key span { display: inline-flex; align-items: center; gap: 5px; }
  .mv-key i { display: inline-grid; place-items: center; width: 22px; height: 18px; border-radius: 3px;
    font-style: normal; font-size: 11px; font-weight: bold; border: 1px solid #e2dccb; }
\n/* ===== UI refresh: clean, warm, mobile-first ===== */
:root{--header-green:#176b52;--header-green-dark:#104b3b;--mint-bg:#f3f7f4;--header-banner:#e9f4ed;--accent-coral:#f4c66b;--accent-coral-dark:#73500c;--border-c:#dce7df;--ink:#20352d;--muted:#71847a;--shadow-soft:0 8px 28px rgba(25,76,56,.08)}
body{padding:clamp(14px,3vw,30px);color:var(--ink);background:radial-gradient(ellipse at 8% 0%,rgba(211,235,219,.72),transparent 34rem),linear-gradient(180deg,#f5f8f5,#eef4ef);font-size:15px}
.wrap{max-width:1040px}h1{font-size:clamp(23px,3vw,30px);letter-spacing:.04em;margin:8px 0 20px;color:var(--header-green-dark)}
h1:before{content:"STORE OPERATIONS  /  TEAM SCHEDULE";display:block;margin-bottom:8px;color:#789386;font-size:10px;font-weight:800;letter-spacing:.2em}
.view-tabs{margin:0 auto 18px;padding:4px;gap:4px;background:#e3ece5;border:1px solid #d7e4da}.view-tabs button{min-height:42px;padding:9px 22px;transition:background .18s,color .18s,box-shadow .18s}.view-tabs button.on{background:var(--header-green);box-shadow:0 3px 9px rgba(23,107,82,.2)}
.me-bar,.edit-panel,.horo,.mv-scroll,table:not(.mpeople):not(.mstaff){border:1px solid var(--border-c);box-shadow:var(--shadow-soft)}
.me-bar{padding:15px 18px;margin-bottom:18px;border-radius:14px;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.me-bar label{color:var(--header-green-dark)}.me-bar select,.controls select{border:1px solid #d5e2d8;border-radius:10px;padding:9px 12px;color:var(--ink)}.me-info{margin:0;flex:1 1 100%}
.controls{gap:9px;margin:0 auto 8px}.controls button,.mv-head button{background:var(--header-green);border-radius:10px;padding:10px 15px;font-weight:700;box-shadow:0 3px 8px rgba(23,107,82,.12);transition:transform .15s,background .15s}.controls button:hover:not(:disabled),.mv-head button:hover:not(:disabled){background:var(--header-green-dark);transform:translateY(-1px)}
.date-field{border:1px solid #d5e2d8;border-radius:10px;padding:10px 14px;box-shadow:0 2px 6px rgba(25,76,56,.04);font-weight:700}.date-hint{color:var(--muted);margin:2px 0 14px}
.date-banner{padding:15px 18px;border:1px solid #d6e8da;border-bottom:0;border-radius:14px 14px 0 0;background:linear-gradient(120deg,#e6f3e9,#f4f8ed);color:var(--header-green-dark);font-size:clamp(19px,2.5vw,24px);letter-spacing:.03em}
table:not(.mpeople):not(.mstaff){border-radius:0 0 14px 14px;box-shadow:var(--shadow-soft)}th{background:var(--header-green);border-color:#236f58;padding:13px 7px;font-size:14px}td{padding:13px 7px;border-color:#e7eee8;background:#fff;font-size:14px;line-height:1.55}td.mgr-cell{background:#fff2d5;color:#79550c}tr.coef-row td{background:#e8f3df;color:#35632b}td.me{box-shadow:inset 0 0 0 2px #e07843}
.legend,.mv-key{gap:8px 16px;color:#60756a}.legend{margin:13px 0 20px}.legend i,.mv-key i{border-color:#d8e4da}

/* ===== Final refinement: enterprise finish + balanced responsive layout ===== */
:root {
  --header-green: #175c48;
  --header-green-dark: #123f34;
  --mint-bg: #f3f6f3;
  --border-c: #dce5de;
  --shadow-soft: 0 10px 30px rgba(23, 65, 49, .075);
}
body { background: #f2f5f2; }
.wrap { max-width: 1120px; }
h1 { font-weight: 800; }
h1::before { color: #81958a; }
.view-tabs { box-shadow: 0 2px 8px rgba(25,76,56,.035); }
.me-bar { background: rgba(255,255,255,.94); }
.me-bar label { font-size: 14px; }
.me-bar select { min-height: 42px; }
.controls button, .mv-head button { min-height: 42px; }
.controls button:focus-visible, .mv-head button:focus-visible,
.view-tabs button:focus-visible, .mv-sub button:focus-visible,
#zBtn:focus-visible { outline: 3px solid rgba(39,123,91,.28); outline-offset: 2px; }
.date-field { min-height: 42px; }
.date-banner { font-weight: 800; }
.day-table-scroll {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  border: 1px solid var(--border-c);
  border-radius: 0 0 14px 14px;
  background: #fff;
  box-shadow: var(--shadow-soft);
}
table.day-schedule {
  min-width: 100%;
  width: 100%;
  border: 0;
  border-radius: 0;
  box-shadow: none;
  table-layout: fixed;
}
table.day-schedule th { padding: 14px 8px; letter-spacing: .025em; }
table.day-schedule td { padding: 13px 8px; overflow-wrap: anywhere; }
table.day-schedule tbody tr:not(.coef-label):not(.coef-row):nth-child(even) td { background: #fbfdfb; }
table.day-schedule td.mgr-cell { background: #fff2d8 !important; }
table.day-schedule tr.coef-label td { background: #f0f5ed; color: #58764c; }
table.day-schedule tr.coef-row td { background: #e8f2e5; }
table.day-schedule tr.coef-row td.coef-low { background: #f9e2de; color: #a33e32; }
.sup-tag { background: #477fa8; letter-spacing: .02em; padding: 1px 8px; }
.legend { padding: 0 2px; }
.mv-scroll { max-width: 100%; }
.mv-scroll table { margin: 0; }
table.mstaff { min-width: 620px; }
table.mstaff th { position: sticky; top: 0; z-index: 1; }
table.mpeople { min-width: max-content; }
table.mpeople th { position: sticky; top: 0; z-index: 2; }
table.mpeople th.nm { z-index: 4; }
table.mpeople .nm { min-width: 76px; }
table.mpeople td, table.mpeople th { min-width: 32px; }
.mv-note { color: #73867b; }
.quote { box-shadow: 0 4px 16px rgba(25,76,56,.035); }
.horo { box-shadow: var(--shadow-soft); }
.footer-note { letter-spacing: .025em; }
button, select, .date-field { -webkit-tap-highlight-color: transparent; }
@media (min-width: 900px) {
  .controls { gap: 12px; }
  .date-field { min-width: 190px; }
  .day-table-scroll { overflow-x: visible; }
  table.day-schedule td { padding: 16px 12px; }
}
@media (max-width: 700px) {
  .day-table-scroll { border-radius: 0 0 12px 12px; }
  table.day-schedule { min-width: 570px; }
  table.day-schedule th { padding: 12px 7px; }
  table.day-schedule td { padding: 12px 7px; font-size: 13px; }
  .date-banner { border-radius: 12px 12px 0 0; }
  .mv-scroll { border-radius: 12px; }
  table.mstaff { min-width: 590px; }
  .mv-note { font-size: 12px; }
}
@media (max-width: 380px) {
  body { padding: 9px; }
  h1 { font-size: 21px; }
  .controls button { padding: 9px 8px; font-size: 13px; }
  .date-field { font-size: 14px; }
  .legend { gap: 7px 10px; }
}

let scheduleData = DEFAULT_SCHEDULE;

/* 人力係數低於這個數字會標成淡紅色，要調整改這裡 */
const LOW_COEF = 2.0;

function pad2(n) { return String(n).padStart(2,"0"); }
function isoOf(y,m,d) { return `${y}-${pad2(m)}-${pad2(d)}`; }

/* 日期加減一律用 UTC 算，避免時區造成跳日 */
function addDays(iso, n) {
  const [y, m, d] = iso.split("-").map(Number);
  const dt = new Date(Date.UTC(y, m - 1, d + n));
  return dt.toISOString().slice(0, 10);
}
function weekdayOf(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(Date.UTC(y, m - 1, d)).getUTCDay();
}
function shortDate(iso) {
  const [, m, d] = iso.split("-").map(Number);
  return `${m}/${d}（${WEEKDAY_ZH[weekdayOf(iso)]}）`;
}
function todayIso() {
  const t = new Date();
  return isoOf(t.getFullYear(), t.getMonth() + 1, t.getDate());
}

const DATES = Object.keys(scheduleData).sort();
const FIRST_DATE = DATES[0];
const LAST_DATE = DATES[DATES.length - 1];
function clampIso(iso) {
  return iso < FIRST_DATE ? FIRST_DATE : iso > LAST_DATE ? LAST_DATE : iso;
}

function formatDateBanner(y, m, d) {
  const dt = new Date(y, m - 1, d);
  const wd = WEEKDAY_ZH[dt.getDay()];
  return `${y}/${m}/${d} 星期${wd}`;
}

function getDayData(iso) {
  const rec = scheduleData[iso];
  if (!rec) return null;
  return rec;
}

/* ── 原店判斷：每個人在「該月」最常出現的那間店就是他的原店，
      在其他店出現就標「支援」。人員調店時會自動跟著變，不用手動維護。 ── */
const HOME_BY_MONTH = {};
function homeOf(name, iso) {
  const ym = iso.slice(0, 7);
  if (!HOME_BY_MONTH[ym]) {
    const cnt = {};
    DATES.filter(k => k.startsWith(ym)).forEach(k => {
      const st = scheduleData[k].stores;
      Object.keys(st).forEach(s => st[s].forEach(n => {
        cnt[n] = cnt[n] || {};
        cnt[n][s] = (cnt[n][s] || 0) + 1;
      }));
    });
    const home = {};
    Object.keys(cnt).forEach(n => {
      home[n] = Object.keys(cnt[n]).sort((a, b) => cnt[n][b] - cnt[n][a])[0];
    });
    HOME_BY_MONTH[ym] = home;
  }
  return HOME_BY_MONTH[ym][name];
}
function isSupport(name, store, iso) {
  if (name === SUPERVISOR || store === "總部") return false;
  const h = homeOf(name, iso);
  return !!h && h !== store;
}

/* ── 我的班：選的名字存在這支手機上 ── */
const ME_KEY = "ym-class-me";
let ME = "";
try { ME = localStorage.getItem(ME_KEY) || ""; } catch (e) {}

function storeOfOn(name, iso) {
  const rec = scheduleData[iso];
  if (!rec) return null;
  for (const s of Object.keys(rec.stores)) {
    if (rec.stores[s].includes(name)) return s;
  }
  return null;
}

function buildMeSelect() {
  const sel = document.getElementById("meSel");
  const lastHome = {};
  DATES.forEach(k => {
    const st = scheduleData[k].stores;
    Object.keys(st).forEach(s => st[s].forEach(n => { lastHome[n] = homeOf(n, k); }));
  });
  /* 最後一個月還有排班的人才列出來（離職的人不會出現） */
  const lastMonth = LAST_DATE.slice(0, 7);
  const active = new Set();
  DATES.filter(k => k.startsWith(lastMonth)).forEach(k => {
    const st = scheduleData[k].stores;
    Object.keys(st).forEach(s => st[s].forEach(n => active.add(n)));
  });
  if (active.has(SUPERVISOR)) {
    const g = document.createElement("optgroup");
    g.label = "督導";
    const o = document.createElement("option");
    o.value = SUPERVISOR; o.textContent = SUPERVISOR;
    g.appendChild(o);
    sel.appendChild(g);
  }
  STORES.forEach(s => {
    const names = [...active].filter(n => n !== SUPERVISOR && lastHome[n] === s);
    if (!names.length) return;
    names.sort((a, b) => rankOf(a, s) - rankOf(b, s));
    const g = document.createElement("optgroup");
    g.label = s;
    names.forEach(n => {
      const o = document.createElement("option");
      o.value = n; o.textContent = n;
      g.appendChild(o);
    });
    sel.appendChild(g);
  });
  if (ME && active.has(ME)) sel.value = ME; else ME = "";
  sel.addEventListener("change", () => {
    ME = sel.value;
    try { ME ? localStorage.setItem(ME_KEY, ME) : localStorage.removeItem(ME_KEY); } catch (e) {}
    renderDay();
    if (VIEW === "month") renderMonth();
  });
}

function renderMeInfo(iso) {
  const box = document.getElementById("meInfo");
  if (!ME) { box.textContent = ""; return; }
  const parts = [];
  const where = storeOfOn(ME, iso);
  parts.push(where
    ? `這天在 <b>${where}</b> 上班`
    : `<span class="me-off">這天休假</span>`);

  /* 這週（週一到週日）上幾天 */
  const wd = weekdayOf(iso);
  const mon = addDays(iso, -((wd + 6) % 7));
  const sun = addDays(mon, 6);
  let work = 0;
  for (let k = mon; k <= sun; k = addDays(k, 1)) if (storeOfOn(ME, k)) work++;
  parts.push(`這週（${shortDate(mon).split("（")[0]}–${shortDate(sun).split("（")[0]}）上 <b>${work}</b> 天`);

  /* 下次休假／下次上班 */
  let k = addDays(iso, 1), found = "";
  while (k <= LAST_DATE) {
    const on = !!storeOfOn(ME, k);
    if (where ? !on : on) { found = k; break; }
    k = addDays(k, 1);
  }
  if (found) parts.push(where ? `下次休假 <b>${shortDate(found)}</b>` : `下次上班 <b>${shortDate(found)}</b>`);
  else parts.push(where ? "班表內已無休假日" : "班表內已無上班日");
  box.innerHTML = parts.map(t => `<span class="me-part">${t}</span>`).join("｜");
}

function renderDay() {
  const picker = document.getElementById("datePicker");
  const iso = picker.value;
  const [y, m, d] = iso.split("-").map(Number);
  document.getElementById("dateBanner").textContent = formatDateBanner(y, m, d);
  document.getElementById("dateLabel").textContent = `${y}/${pad2(m)}/${pad2(d)}`;
  document.getElementById("prevBtn").disabled = iso <= FIRST_DATE;
  document.getElementById("nextBtn").disabled = iso >= LAST_DATE;
  renderMeInfo(iso);

  const headerRow = document.getElementById("headerRow");
  const tbody = document.getElementById("scheduleBody");
  headerRow.innerHTML = "";
  tbody.innerHTML = "";

  const dayData = getDayData(iso);

  if (!dayData) {
    tbody.innerHTML = `<tr><td colspan="6" class="empty-day">尚無此日期資料</td></tr>`;
    STORES.forEach(s => {
      const th = document.createElement("th");
      th.textContent = s;
      headerRow.appendChild(th);
    });
    return;
  }

  const displayCols = STORES.filter(s =>
    s !== "總部" || (dayData.stores["總部"] || []).length > 0);
  displayCols.forEach(s => {
    const th = document.createElement("th");
    th.textContent = s;
    headerRow.appendChild(th);
  });

  /* 依職級排序，同職級維持原本順序 */
  const ordered = {};
  displayCols.forEach(s => {
    ordered[s] = (dayData.stores[s] || [])
      .map((n, i) => ({ n, i, r: rankOf(n, s) }))
      .sort((a, b) => a.r - b.r || a.i - b.i)
      .map(x => x.n);
  });

  const maxLen = Math.max(...displayCols.map(s => ordered[s].length), 1);
  for (let i = 0; i < maxLen; i++) {
    const tr = document.createElement("tr");
    displayCols.forEach(s => {
      const td = document.createElement("td");
      const name = ordered[s][i] || "";
      if (name) {
        td.appendChild(document.createTextNode(name));
        if (isSupport(name, s, iso)) {
          const tag = document.createElement("span");
          tag.className = "sup-tag";
          tag.textContent = "支援";
          td.appendChild(tag);
        }
        if (NAME_BG[name]) td.style.background = NAME_BG[name];
        else if (MANAGER_SET.has(name)) td.classList.add("mgr-cell");
        if (name === ME) td.classList.add("me");
      }
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  }

  const labelRow = document.createElement("tr");
  labelRow.className = "coef-label";
  const ltd = document.createElement("td");
  ltd.colSpan = displayCols.length;
  ltd.textContent = "▼ 人力係數";
  labelRow.appendChild(ltd);
  tbody.appendChild(labelRow);

  const coefRow = document.createElement("tr");
  coefRow.className = "coef-row";
  displayCols.forEach(s => {
    const td = document.createElement("td");
    if (s === "總部") {
      td.textContent = "";
    } else {
      const val = (dayData.coef && dayData.coef[s] !== undefined) ? dayData.coef[s] : 0;
      td.textContent = val.toFixed(2);
      if (val < LOW_COEF) td.classList.add("coef-low");
    }
    coefRow.appendChild(td);
  });
  tbody.appendChild(coefRow);
}

/* 支援 showPicker 的瀏覽器（電腦版 Chrome/Edge 等）：點整個欄位就打開日曆。
   不支援的舊版：透明的原生欄位仍可直接點，行為不變。 */
(function bindPicker() {
  const dp = document.getElementById("datePicker");
  const field = document.getElementById("dateField");
  /* 觸控裝置：讓透明的原生欄位自己接手，手指點下去就會叫出系統日曆。
     滑鼠裝置：原生欄位不吃點擊，改由整個欄位觸發 showPicker。 */
  const coarse = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
  if (!coarse && typeof dp.showPicker === "function") {
    dp.style.pointerEvents = "none";
  }
  field.addEventListener("click", (e) => {
    if (e.target === dp) return;          /* 點在原生欄位上，交給系統處理 */
    if (typeof dp.showPicker === "function") {
      try { dp.showPicker(); return; } catch (err) {}
    }
    dp.focus();
    dp.click();
  });
})();

function hseed(str){ let h=2166136261; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619);} return (h>>>0); }
/* 以日期為種子洗牌，確保同一天 12 個星座拿到 12 句不同的話 */
function dayTexts(iso){
  const idx = Z_TXT.map((_, i) => i);
  let r = hseed("txt|" + iso);
  for (let i = idx.length - 1; i > 0; i--) {
    r = (Math.imul(r, 1664525) + 1013904223) >>> 0;
    const j = r % (i + 1);
    [idx[i], idx[j]] = [idx[j], idx[i]];
  }
  return idx.slice(0, SIGNS.length).map(i => Z_TXT[i]);
}
function zOf(iso, sign){
  const h = hseed(iso + "|" + sign);
  return { h, star: 2 + (h % 4),
    col: Z_COLOR[(h>>>9) % Z_COLOR.length],
    num: 1 + ((h>>>17) % 9) };
}
function drawZodiac(){
  /* 一律用「今天」，不跟著班表選的日期走，也看不到未來的運勢 */

            + "-" + String(t.getDate()).padStart(2,"0");

  const hs = hseed(iso);
  document.getElementById("zSub").textContent = Z_SUB[hs % Z_SUB.length];

  const texts = dayTexts(iso);
  const data = SIGNS.map((sg, i) => {
    const r = zOf(iso, sg[0]);
    r.txt = texts[i];
    return { i, name: sg[0], sym: sg[1], c: sg[2], r, score: r.star * 1000 + (r.h % 1000) };
  });
  const order = data.slice().sort((a,b) => b.score - a.score).map(x => x.name);

  document.getElementById("zGrid").innerHTML = data.map((x, idx) => {
    const rank = order.indexOf(x.name);

}

  if (MTAB === "staff") renderMonthStaff(); else renderMonthPeople();
}

function renderMonthStaff() {
  const days = monthDates(MONTH);
  const cols = STORES.filter(s => s !== "總部");
  const today = todayIso();
  const sum = {}, cnt = {};
  let h = '<table class="mstaff"><thead><tr><th>日期</th>' +
    cols.map(s => `<th>${s}</th>`).join("") + '</tr></thead><tbody>';
  days.forEach(k => {
    const rec = scheduleData[k], wd = weekdayOf(k);
    const cls = [(wd === 0 || wd === 6) ? "we" : "", k === today ? "today" : ""].join(" ").trim();
    h += `<tr data-d="${k}" class="${cls}"><td class="d">${shortDate(k).replace("（", "<br>（")}</td>`;
    cols.forEach(s => {
      const c = rec.coef[s] || 0, n = (rec.stores[s] || []).length;
      sum[s] = (sum[s] || 0) + c; cnt[s] = (cnt[s] || 0) + 1;
      h += `<td class="${c < LOW_COEF ? "low" : ""}"><span class="c">${c.toFixed(2)}</span><span class="n">${n} 人</span></td>`;
    });
    h += '</tr>';
  });
  h += '<tr class="avg"><td>平均</td>' +
    cols.map(s => `<td>${(sum[s] / cnt[s]).toFixed(2)}</td>`).join("") + '</tr>';
  h += '</tbody></table>';
  const body = document.getElementById("mvBody");
  body.innerHTML = h;
  body.querySelectorAll("tr[data-d]").forEach(tr =>
    tr.addEventListener("click", () => jumpToDay(tr.dataset.d)));
  document.getElementById("mvNote").innerHTML =
    `大字是人力係數、小字是人數；淡紅色＝係數低於 ${LOW_COEF.toFixed(1)}<br>點任一天可跳到當天班表`;
}

function renderMonthPeople() {
  const days = monthDates(MONTH);
  const today = todayIso();
  /* 這個月有出現的人，依原店分組 */
  const people = new Set();
  days.forEach(k => Object.values(scheduleData[k].stores).forEach(ns => ns.forEach(n => people.add(n))));
  const groups = [];
  if (people.has(SUPERVISOR)) groups.push(["督導", [SUPERVISOR]]);
  STORES.forEach(s => {
    const ns = [...people].filter(n => n !== SUPERVISOR && homeOf(n, days[0]) === s)
      .sort((a, b) => rankOf(a, s) - rankOf(b, s));
    if (ns.length) groups.push([s, ns]);
  });

  let h = '<table class="mpeople"><thead><tr><th class="nm">姓名</th>';
  days.forEach(k => {
    const wd = weekdayOf(k), d = Number(k.slice(8));
    const cls = [(wd === 0 || wd === 6) ? "we" : "", k === today ? "today" : ""].join(" ").trim();
    h += `<th class="${cls}" data-d="${k}">${d}<br>${WEEKDAY_ZH[wd]}</th>`;
  });
  h += '<th>天數</th></tr></thead><tbody>';
  groups.forEach(([g, ns]) => {
    h += `<tr class="grp"><td class="nm">${g}</td><td colspan="${days.length + 1}"></td></tr>`;
    ns.forEach(n => {
      let work = 0;
      h += `<tr class="${n === ME ? "me" : ""}"><td class="nm">${n}</td>`;
      days.forEach(k => {
        const s = storeOfOn(n, k);
        if (!s) { h += '<td class="off">休</td>'; return; }
        work++;
        const we = [0, 6].includes(weekdayOf(k)) ? " we" : "";
        if (n === SUPERVISOR) h += `<td class="boss">${SHORT[s] || s}</td>`;
        else if (isSupport(n, s, k)) h += `<td class="sup">${SHORT[s] || s}</td>`;
        else h += `<td class="w${we}"></td>`;
      });
      h += `<td class="cnt">${work}</td></tr>`;
    });
  });
  h += '</tbody></table>';
  const body = document.getElementById("mvBody");
  body.innerHTML = h;
  body.querySelectorAll("th[data-d]").forEach(th =>
    th.addEventListener("click", () => jumpToDay(th.dataset.d)));
  /* 每次開啟全員班表都從 1 號開始，避免手機上看不到月初 */
  body.scrollLeft = 0;
  document.getElementById("mvNote").innerHTML =
    '<div class="mv-key">' +
    '<span><i style="background:#e3f1e6"></i>在原店上班</span>' +
    '<span><i style="color:#d0533f;background:#fff">休</i>休假</span>' +
    '<span><i style="background:#5b8fc9;color:#fff;border-color:#5b8fc9">仁</i>去別店支援（寫支援的店）</span>' +
    '<span><i style="background:#fff6dc;color:#6b4a00">凱</i>督導當天所在店</span>' +
    '</div>表格可左右滑動；點上方日期可跳到當天班表';
}

document.getElementById("tabDay").addEventListener("click", () => setView("day"));
document.getElementById("tabMonth").addEventListener("click", () => setView("month"));
document.getElementById("mPrev").addEventListener("click", () => {
  const i = MONTHS.indexOf(MONTH); if (i > 0) { MONTH = MONTHS[i - 1]; renderMonth(); }
});
document.getElementById("mNext").addEventListener("click", () => {
  const i = MONTHS.indexOf(MONTH); if (i < MONTHS.length - 1) { MONTH = MONTHS[i + 1]; renderMonth(); }
});
document.querySelectorAll(".mv-sub button").forEach(b => b.addEventListener("click", () => {
  MTAB = b.dataset.t; renderMonth();
}));

(function init() {
  const dp = document.getElementById("datePicker");
  dp.min = FIRST_DATE;
  dp.max = LAST_DATE;
  buildMeSelect();
  goTo(todayIso());
  let v = "day";
  try { v = localStorage.getItem("ym-class-view") || "day"; } catch (e) {}
  setView(v === "month" ? "month" : "day");
})();
</script>
</body>
